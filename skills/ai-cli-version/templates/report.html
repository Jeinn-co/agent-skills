<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>CLI Versions</title>
<script data-report-i18n>@@lang_head@@</script>
<style>
:root:not([data-lang=zh]) .l-zh,:root[data-lang=zh] .l-en{display:none}
:root{color-scheme:light;--bg:#f1f5f9;--card:#ffffff;--text:#0f172a;--muted:#475569;--line:#e2e8f0;--track:#e2e8f0;--ok:#15803d;--up:#b45309;--bad:#b91c1c;--accent:#2563eb;--accent-hover:#1d4ed8;--btn-fg:#ffffff;--th-bg:#f8fafc;--code-bg:#f1f5f9;--badge-mix:8%;--row-tint:.06;--row-hover:.11;--shadow:0 1px 2px rgba(15,23,42,.05),0 4px 12px rgba(15,23,42,.03)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;@@dark@@;--accent-hover:#bfdbfe;--btn-fg:#0f172a;--th-bg:rgba(15,23,42,.28);--code-bg:rgba(15,23,42,.45);--badge-mix:14%;--row-tint:.11;--row-hover:.17;--shadow:0 1px 2px rgba(0,0,0,.28),0 6px 16px rgba(0,0,0,.18)}}
:root[data-theme=dark]{color-scheme:dark;@@dark@@;--accent-hover:#bfdbfe;--btn-fg:#0f172a;--th-bg:rgba(15,23,42,.28);--code-bg:rgba(15,23,42,.45);--badge-mix:14%;--row-tint:.11;--row-hover:.17;--shadow:0 1px 2px rgba(0,0,0,.28),0 6px 16px rgba(0,0,0,.18)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 "Inter","Segoe UI",system-ui,-apple-system,sans-serif;padding:40px clamp(14px,4vw,40px) 52px;-webkit-font-smoothing:antialiased}
main{max-width:1040px;margin:0 auto}
.title-row{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-size:clamp(24px,3.2vw,30px);font-weight:700;letter-spacing:-.025em;line-height:1.2;margin:0 0 6px}
.top{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;margin:0 0 20px}
.lang{font:inherit;font-size:13.5px;font-weight:500;min-height:34px;padding:4px 14px;border:1px solid color-mix(in srgb,var(--accent) 55%,var(--line));border-radius:6px;background:transparent;color:var(--accent);cursor:pointer;touch-action:manipulation;transition:background-color .15s ease,border-color .15s ease,color .15s ease,opacity .15s ease}
.lang:hover:not(:disabled){background:color-mix(in srgb,var(--accent) 10%,transparent);border-color:var(--accent)}
.lang:active:not(:disabled){background:color-mix(in srgb,var(--accent) 16%,transparent)}
.lang:focus-visible,.tools button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lang:disabled{opacity:.55;cursor:not-allowed}
.tools .sel{border-radius:6px;border-color:color-mix(in srgb,var(--accent) 55%,var(--line));transition:background-color .15s ease,border-color .15s ease}
.tools .sel:hover{background:color-mix(in srgb,var(--accent) 10%,transparent);border-color:var(--accent)}
.tools button#all{background:var(--accent);color:var(--btn-fg);border-color:transparent;font-weight:600;touch-action:manipulation}
.tools button#all:hover:not(:disabled){background:var(--accent-hover)}
.tools button#all:disabled,.tools button:disabled{opacity:.55;cursor:not-allowed}
.summary{font-size:15px;font-weight:600;line-height:1.45;margin:0 0 20px;padding:13px 16px;border-radius:10px;border:1px solid var(--line);border-left:4px solid currentColor;background:var(--card);box-shadow:var(--shadow)}
.summary.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) var(--badge-mix),var(--card));border-color:color-mix(in srgb,var(--ok) 24%,var(--line));border-left-color:var(--ok)}
.summary.up{color:var(--up);background:color-mix(in srgb,var(--up) var(--badge-mix),var(--card));border-color:color-mix(in srgb,var(--up) 26%,var(--line));border-left-color:var(--up)}
.summary.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) var(--badge-mix),var(--card));border-color:color-mix(in srgb,var(--bad) 26%,var(--line));border-left-color:var(--bad)}
.summary.muted{color:var(--muted)}
.note{color:var(--muted);font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0;box-shadow:var(--shadow)}
.skel{height:10px;margin:6px 0;border-radius:999px;background:linear-gradient(90deg,var(--track) 30%,var(--card) 50%,var(--track) 70%);background-size:300% 100%;animation:shimmer 1.4s linear infinite}
@keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.5}
.logo{width:18px;height:18px;margin-right:10px;vertical-align:-3px;flex:none}
th,td{padding:14px 16px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
thead th{background:var(--th-bg);color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;padding:11px 16px;white-space:nowrap}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:600;white-space:nowrap;color:var(--text)}
td b{font-weight:600;font-variant-numeric:tabular-nums}
tr[data-row=claude]{--brand:217,119,87}
tr[data-row=codex]{--brand:16,163,127}
tr[data-row=grok]{--brand:148,163,184}
tr[data-row=muse]{--brand:149,83,255}
tr[data-row=agy]{--brand:49,134,255}
tr[data-row] td{background:rgba(var(--brand),var(--row-tint));transition:background-color .15s ease}
tr[data-row]:hover td{background:rgba(var(--brand),var(--row-hover))}
tr[data-row] td:first-child{border-left:4px solid rgb(var(--brand));padding-left:12px}
.sub{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;margin-top:3px}
span.sub{margin-left:5px}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;line-height:1.45;letter-spacing:.01em;white-space:nowrap;border:1px solid color-mix(in srgb,currentColor 30%,var(--line));background:color-mix(in srgb,currentColor var(--badge-mix),var(--card))}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.badge.ok{color:var(--ok)}.badge.up{color:var(--up)}.badge.bad{color:var(--bad)}.badge.muted{color:var(--muted)}
td.bad{color:var(--bad);font-weight:500}td.muted{color:var(--muted)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;color:var(--text);background:var(--code-bg);border:1px solid var(--line);padding:2px 7px;border-radius:5px;display:inline-block;margin-left:6px;vertical-align:middle;overflow-wrap:anywhere}
main button.acv-up{margin-left:8px;min-height:30px;padding:4px 12px;border:0;border-radius:6px;font:inherit;font-size:13px;font-weight:600;line-height:1.3;background:var(--accent);color:var(--btn-fg);cursor:pointer;vertical-align:middle;touch-action:manipulation;transition:background-color .15s ease,transform .1s ease,opacity .15s ease}
main button.acv-up:hover:not(:disabled){background:var(--accent-hover)}
main button.acv-up:active:not(:disabled){transform:translateY(1px)}
main button.acv-up:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main button.acv-up:disabled{opacity:.55;cursor:not-allowed;transform:none}
main .acv-err{color:var(--bad);font-size:13px;font-weight:500;line-height:1.45;margin-top:6px}
main .acv-run{color:var(--muted);font-size:13px;line-height:1.45;margin-top:6px;font-variant-numeric:tabular-nums}
#foot{margin-top:14px}
.foot{color:var(--muted);font-size:13px;line-height:1.55;margin:6px 2px 0}
main>p:last-of-type{color:var(--muted);font-size:13.5px;margin:22px 0 0}
a{color:var(--accent);text-underline-offset:3px;text-decoration-thickness:1px}
a:hover{color:var(--accent-hover)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (max-width:640px){
body{padding:40px 14px 36px}
th,td{padding:11px 12px}
thead th{padding:10px 12px}
tr[data-row] td:first-child{padding-left:8px}
.summary{padding:11px 14px;font-size:14px}
code{margin:4px 0 0}
main button.acv-up{margin:6px 0 0;min-height:36px}
}
@media (prefers-reduced-motion:reduce){
.skel{animation:none}
.lang,.tools .sel,tr[data-row] td,main button.acv-up{transition:none}
main button.acv-up:active:not(:disabled){transform:none}
}
</style></head><body><main>
<div class="title-row"><h1>CLI Versions</h1>@@language_button@@</div><p class="top">@@time@@ · ai-cli-version @@version@@</p>
@@summary@@
<div class="tablewrap"><table><thead><tr><th>@@i18n_tool@@</th><th>@@i18n_installed@@</th><th>@@i18n_latest@@</th><th>@@i18n_status@@</th></tr></thead>
<tbody>@@rows@@</tbody></table></div>
<div id="foot">@@foot@@@@skipped@@</div>
<p>@@i18n_model_selection_guide@@<a href="@@compare@@" target="_blank" rel="noopener">AI Model Compare</a></p>
</main><script>@@lang_script@@</script></body></html>
